apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace = "com.routinist.wear"
    compileSdk = rootProject.ext.compileSdkVersion   // 36

    defaultConfig {
        // Play Multi-APK: 폰 앱과 동일 applicationId 로 한 리스팅에 배포.
        applicationId "com.routinist.app"
        minSdkVersion 30                              // Wear OS 3+
        targetSdkVersion 35                           // Play 정책: Wear 도 2026-08-31 까지 API 35 필수
        // versionCode 는 폰과 반드시 달라야 함 (같은 앱, 다른 폼팩터 APK).
        // 폰 build 324 → 워치는 1_000_000 오프셋 스킴으로 충돌 방지.
        versionCode 1000329   // v8: Play SDK 권고 2건 (fragment 1.1.0 / protolayout-proto beta01)
        versionName "1.2.21"
    }

    signingConfigs {
        release {
            def keystorePropsFile = rootProject.file('keystore.properties')
            if (keystorePropsFile.exists()) {
                def props = new Properties()
                props.load(new FileInputStream(keystorePropsFile))
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (rootProject.file('keystore.properties').exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
    buildFeatures {
        compose true
    }
}

dependencies {
    // 스플래시 아이콘 — Wear OS 3(API 30) 은 시스템 스플래시가 없어 백포트가 필요 (Play 품질 가이드라인)
    implementation "androidx.core:core-splashscreen:1.0.1"

    // Health Services — 워치 라이브 운동 트래킹
    implementation "androidx.health:health-services-client:1.1.0-rc02"
    // ExerciseClient 는 Guava ListenableFuture 를 반환 — 타입 노출용 guava + await() 확장
    implementation "androidx.concurrent:concurrent-futures-ktx:1.2.0"
    implementation "com.google.guava:guava:33.4.8-android"

    // Wearable Data Layer — 완주 데이터를 폰으로 전송
    implementation "com.google.android.gms:play-services-wearable:20.0.1"

    // 컴플리케이션 (워치페이스 런처) — 2026-08-02
    // 2026-08-14: 1.2.1 → 1.3.0. Play SDK 권고 대응 —
    // 1.2.1 이 protolayout-proto 1.0.0-beta01 을 끌고 오는데 그 안의 protobuf 가
    // CVE-2024-7254 (중첩 데이터 파싱 DoS) 대상이다. proto 만 강제로 올리면
    // 같은 계열의 expression/pipeline 은 beta01 로 남아 런타임에 깨질 수 있어
    // 부모를 올려 계열 전체를 일관되게 맞춘다.
    implementation "androidx.wear.watchface:watchface-complications-data-source-ktx:1.3.0"

    constraints {
        // Play SDK 권고: wear AAB 에 fragment 1.1.0 이 실려 있었다 (폰은 1.8.9 로 해결됨).
        // wear 모듈엔 fragment 를 끌어올릴 상위 의존성이 없어 play-services-wearable 이
        // 요구하는 1.1.0 에 머물렀다. 폰과 같은 선으로 맞춘다.
        implementation("androidx.fragment:fragment:1.8.9") {
            because "Play SDK 권고 — 1.1.0 은 구버전, 폰 모듈과 동일선 정렬"
        }
        // watchface 1.3.0 은 protolayout 1.0.0 을 끌고 온다. Google 권고 버전은 1.2.1 —
        // proto 하나만 올리면 expression/pipeline 과 세대가 어긋나므로 **계열 전체**를 맞춘다.
        ["protolayout-proto", "protolayout-expression", "protolayout-expression-pipeline"].each { m ->
            implementation("androidx.wear.protolayout:$m:1.2.1") {
                because "CVE-2024-7254 (protobuf) — Google 권고 1.2.1"
            }
        }
    }

    // Compose for Wear OS
    def composeBom = platform("androidx.compose:compose-bom:2026.06.01")
    implementation composeBom
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.wear.compose:compose-material3:1.6.2"
    implementation "androidx.wear.compose:compose-foundation:1.6.2"
    implementation "androidx.wear.compose:compose-navigation:1.6.2"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlinxCoroutinesVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:$kotlinxCoroutinesVersion"
}
